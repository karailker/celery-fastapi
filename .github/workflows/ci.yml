name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, "feature/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-lint-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-lint-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root

      - name: Install project
        run: poetry install --no-interaction

      - name: Run Ruff linter
        run: poetry run ruff check celery_fastapi tests

      - name: Run Ruff formatter check
        run: poetry run ruff format --check celery_fastapi tests

      - name: Run mypy
        run: poetry run mypy celery_fastapi

  python-matrix:
    # Pre-release interpreters join the matrix only once setup-python can
    # install them, so an unpublished version never turns CI red.
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build Python test matrix
        id: build
        run: |
          manifest=$(curl -fsSL https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json || echo '[]')
          include='[]'
          for v in 3.15 3.16; do
            if echo "$manifest" | jq -e --arg v "$v" 'any(.[]; .version | startswith($v + "."))' >/dev/null; then
              include=$(echo "$include" | jq -c --arg v "$v" '. + [{"python-version": $v, "experimental": true}]')
            else
              echo "::notice::Python $v is not published yet; skipping its test job"
            fi
          done
          matrix=$(jq -nc --argjson inc "$include" '{"python-version":["3.11","3.12","3.13","3.14"],"experimental":[false],"include":$inc}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    name: test (${{ matrix.python-version }})
    needs: python-matrix
    runs-on: ubuntu-latest
    # Pre-release interpreters must not block merges.
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.python-matrix.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-test-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            venv-test-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root --extras all

      - name: Install project
        run: poetry install --no-interaction --extras all

      - name: Start broker/backend services
        run: docker compose up -d --wait

      - name: Start live Celery worker
        run: |
          nohup poetry run celery -A tests.broker_workers:live_app worker \
            --loglevel=warning -P solo > worker.log 2>&1 &
          echo $! > worker.pid
          sleep 8

      - name: Run tests with coverage
        run: poetry run pytest --cov=celery_fastapi --cov-report=xml

      - name: Stop worker and services
        if: always()
        run: |
          kill "$(cat worker.pid)" 2>/dev/null || true
          docker compose down -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so poetry-dynamic-versioning reads the tag

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        uses: snok/install-poetry@v1

      - name: Build package
        run: poetry build

      - name: Verify package
        run: |
          pip install dist/*.whl
          python -c "import celery_fastapi; print(f'Version: {celery_fastapi.__version__}')"

      - name: Store build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
